    - paragraph [ref=f18e19]: Award-worthy commercial cleaning services — built from the ground up by people who have done this work themselves.
  - generic [ref=f18e22]:
    - img "Flex Commercial Services founders David George and Riley Hinkel" [ref=f18e25]
    - generic [ref=f18e26]:
      - generic [ref=f18e27]: Our Story
      - heading "Live now, clean less." [level=2] [ref=f18e28]
      - blockquote [ref=f18e30]: David George and Riley Hinkel started Flex Services the way most good things start — with years of actual work. Not from a boardroom, but from restaurant kitchens and office hallways. They saw firsthand how a truly professional clean could transform a business environment, and they built Flex because they knew they could do it better.
      - paragraph [ref=f18e31]: Every job at Flex gets that same personal attention to detail that David and Riley brought from day one. We're not a franchise operation — we're a Northeast Ohio business that takes pride in the community we serve.
      - paragraph [ref=f18e32]: From medical sanitization and routine office maintenance to post-event cleanup, Flex Commercial Services delivers professional cleaning done right, every time.
