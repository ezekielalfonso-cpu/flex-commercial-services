  - generic [ref=f2e23]:
    - img "Flex Family of Companies" [ref=f2e26]
    - generic [ref=f2e27]:
      - generic [ref=f2e28]: Our Story
      - heading "Live now, clean less." [level=2] [ref=f2e29]
      - blockquote [ref=f2e31]: David George and Riley Hinkel started Flex Services the way most good things start — with years of actual work. Not from a boardroom, but from restaurant kitchens and office hallways. They saw firsthand how a truly professional clean could transform a business environment, and they built Flex because they knew they could do it better.
      - paragraph [ref=f2e32]: Every job at Flex gets that same personal attention to detail that David and Riley brought from day one. We're not a franchise operation — we're a Northeast Ohio business that takes pride in the community we serve.
      - paragraph [ref=f2e33]: From medical sanitization and routine office maintenance to post-event cleanup, Flex Commercial Services delivers professional cleaning done right, every time.
