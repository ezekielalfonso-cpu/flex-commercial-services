      - button "How often should I schedule commercial cleaning?" [ref=f20e24]:
        - generic [ref=f20e25]: How often should I schedule commercial cleaning?
        - img [ref=f20e26]
      - region "How often should I schedule commercial cleaning?":
        - paragraph [ref=f20e28]: It depends on your industry and foot traffic. Most offices benefit from weekly or bi-weekly service, while restaurants and medical facilities typically require daily cleaning. We'll recommend a schedule based on your specific space during your free consultation.
    - generic [ref=f20e29]:
      - button "Do you bring your own supplies and equipment?" [ref=f20e30]:
        - generic [ref=f20e31]: Do you bring your own supplies and equipment?
        - img [ref=f20e32]
      - region "Do you bring your own supplies and equipment?":
        - paragraph [ref=f20e34]: Yes. Our team arrives fully equipped with professional-grade cleaning products, tools, and equipment. If you have preferences for specific products (fragrance-free, eco-friendly, etc.) just let us know and we'll accommodate.
    - generic [ref=f20e35]:
      - button "Are you insured and bonded?" [ref=f20e36]:
        - generic [ref=f20e37]: Are you insured and bonded?
        - img [ref=f20e38]
      - region "Are you insured and bonded?":
        - paragraph [ref=f20e40]: Absolutely. Flex Commercial Services is fully insured and bonded for your protection and peace of mind.
    - generic [ref=f20e41]:
      - button "Do you offer contracts or is it month-to-month?" [ref=f20e42]:
        - generic [ref=f20e43]: Do you offer contracts or is it month-to-month?
        - img [ref=f20e44]
      - region "Do you offer contracts or is it month-to-month?":
        - paragraph [ref=f20e46]: We offer both. We have flexible month-to-month arrangements as well as discounted contract pricing for clients who prefer a longer-term commitment. We'll find the structure that works best for your business.
    - generic [ref=f20e47]:
      - button "What industries do you serve?" [ref=f20e48]:
        - generic [ref=f20e49]: What industries do you serve?
        - img [ref=f20e50]
      - region "What industries do you serve?":
        - paragraph [ref=f20e52]: We serve a wide range of industries including offices, restaurants, fitness centers, schools, daycares, medical facilities, and more across Northeast Ohio.
    - generic [ref=f20e53]:
