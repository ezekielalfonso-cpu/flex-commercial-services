        - img [ref=f20e68]
      - region "Do you serve areas outside of Cleveland?":
        - paragraph [ref=f20e70]: Yes. We serve the greater Northeast Ohio area including Lakewood, Parma, Strongsville, Beachwood, Solon, and surrounding communities. Contact us to confirm service availability in your area.
